# Primary CI pipeline. Path-filtered so a change only runs the jobs it affects; a `contract/**`
# change fans out to all consumers (AR17). Complements corpus-coherence.yml (grep-gate + contract
# example validation) — this file adds the schema-lint and Conventional-Commits gates it does not
# cover. Green on the empty scaffold.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      services: ${{ steps.filter.outputs.services }}
      libs: ${{ steps.filter.outputs.libs }}
      e2e: ${{ steps.filter.outputs.e2e }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'
              - 'scripts/check-schema-lint.py'
              - 'scripts/validate-contract.py'
              - 'scripts/check-invalid-fixtures.py'
              - 'tests/contract/**'
              - 'pytest.ini'
            services:
              - 'services/**'
              - 'contract/**'   # a contract change rebuilds every consumer (fan-out)
              - 'libs/**'
            libs:
              - 'libs/**'
            e2e:
              # The conformance harness drives the real service binaries against the
              # real contract, so a change to any of them re-runs the e2e smoke (AR17 fan-out).
              - 'tests/conformance/**'
              - 'services/**'
              - 'contract/**'
              - 'libs/**'
            deploy:
              # The per-service deploy pipeline (Story 1.12): release workflow, prod overlay,
              # poller + its selection logic, the shared tag parser, and the validity gates.
              - 'deploy/**'
              - '.github/workflows/release.yml'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'scripts/parse-service-tag.sh'
              - 'scripts/check-prod-compose.sh'
              - 'scripts/check-release-workflow.sh'

  schema-lint:
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema
      - name: Schema-lint — envelope well-formed + no additionalProperties:false on event objects
        run: python scripts/check-schema-lint.py
      - name: Schema-lint selftest (proves the gate catches a violation)
        run: python scripts/check-schema-lint.py --selftest

  invalid-fixtures:
    # The NEGATIVE pass of the contract-test layer: every *.invalid.json known-bad fixture
    # MUST be rejected, and required example<->invalid pairs must exist (a deleted/orphaned
    # or no-longer-bad fixture fails the build). Complements the example-pass that runs in
    # corpus-coherence.yml (validate-contract.py).
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema
      - name: Known-bad fixtures are rejected + pairing enforced
        run: python scripts/check-invalid-fixtures.py
      - name: Invalid-fixtures selftest (proves the gate has teeth)
        run: python scripts/check-invalid-fixtures.py --selftest

  contract-tests:
    # Exhaustive contract-validation suite: programmatically exercises every possible
    # envelope/data violation against the timing schemas (plus the committed
    # examples/fixtures and the gate selftests). Comprehensive sibling of the gate scripts.
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema pytest
      - name: pytest — exhaustive contract validation
        run: python -m pytest tests/contract

  libs-go:
    # The shared Go blueprint library (libs/go-pitwall, Story 2.1): build + vet + unit
    # tests for the extracted mechanics (logger, envelope+validator, persistence
    # outbox/inbox, messaging supervisor/publisher/Bus/DLQ, relay, heartbeat, erasure
    # scaffold). Broker-free (the supervisor uses a fake connector; persistence uses
    # pure-Go SQLite), so no testcontainers here. The per-service jobs build AGAINST the
    # lib (replace-pinned) but `go test ./...` in a service module does not run the lib's
    # own tests — this job is their CI gate. Triggered by libs/** and the contract/**
    # fan-out (the validator + erasure ack validate against /contract).
    needs: changes
    if: ${{ needs.changes.outputs.libs == 'true' || needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    # GOWORK=off: test the lib standalone against its own go.mod/go.sum (the repo-root
    # go.work is dev-only), so the cache key (go.sum) is correct. Story 2.1.
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: libs/go-pitwall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: libs/go-pitwall/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...

  timing-go:
    # The Timing Go service skeleton (Story 1.3). Build + vet + unit tests always; the
    # integration test stands up a REAL RabbitMQ via testcontainers (GitHub's ubuntu
    # runners ship Docker, so no extra wiring needed). Triggered by services/** and the
    # contract/** fan-out (a contract change re-tests the producer's validate-on-publish).
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    # GOWORK=off: build exactly like the container (per-service go.mod `replace` of
    # libs/go-pitwall), not via the repo-root go.work (dev-only). Story 2.1.
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: services/timing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/timing/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real RabbitMQ via testcontainers)
        run: go test -tags=integration -timeout 300s ./test/integration/...

  leaderboard-go:
    # The Leaderboard Go consumer service (Story 1.7). Build + vet + unit tests always;
    # the integration test stands up a REAL RabbitMQ via testcontainers. No Node step is
    # needed: //go:embed all:dist resolves against the committed dist/.gitkeep placeholder,
    # so the Go gate tests the SSE/render/consume logic independently of the frontend build
    # (the real Vite bundle is built in the Docker image's node stage). Triggered by
    # services/** and the contract/** fan-out (re-tests validate-on-consume).
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    # GOWORK=off: build exactly like the container (per-service go.mod `replace` of
    # libs/go-pitwall), not via the repo-root go.work (dev-only). Story 2.1.
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: services/leaderboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/leaderboard/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real RabbitMQ via testcontainers)
        run: go test -tags=integration -timeout 300s ./test/integration/...

  identity-go:
    # The Identity Go service (Story 2.2): the canonical-id issuer — a consumer (binds
    # frontend.events) AND an outbox-backed producer (publishes identity.resolved). Build
    # + vet + unit tests always; the integration test stands up a REAL RabbitMQ via
    # testcontainers. Triggered by services/** and the contract/** fan-out (re-tests
    # validate-on-consume + validate-on-publish).
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    # GOWORK=off: build exactly like the container (per-service go.mod `replace` of
    # libs/go-pitwall), not via the repo-root go.work (dev-only). Story 2.1.
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/identity/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real RabbitMQ via testcontainers)
        run: go test -tags=integration -timeout 600s ./test/integration/...

  e2e-smoke:
    # The 4th test layer (NFR23): the cross-language conformance harness + e2e smoke.
    # A thin Go runner (tests/conformance/go) drives the REAL built service binaries
    # (Timing simulator + Leaderboard) against ONE shared real RabbitMQ (testcontainers),
    # running the scenarios/*.yaml spec (smoke + publish-redeliver/inbox-dup/crash-after-ack/
    # peer-down). This is the REQUIRED merge gate — it runs the non-quarantined lane.
    # No Docker image build (that is release.yml, Story 1.12); ubuntu runners ship Docker.
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/conformance/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: tests/conformance/go/go.sum
      - name: Unit tests (loader + lane filter, broker-free)
        run: go test ./...
      - name: Conformance + e2e smoke (required lane — real binaries + real RabbitMQ)
        run: go test -tags=integration -timeout 900s ./...

  e2e-smoke-quarantine:
    # The quarantine lane (AR16: a flaky scenario goes here, NEVER @skip). It STILL
    # RUNS the quarantined scenarios but does not block the merge (continue-on-error).
    # For Epic 1 this lane is empty (zero quarantined scenarios) — the job exists so a
    # future flaky scenario has a defined, non-blocking home instead of being skipped.
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: tests/conformance/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: tests/conformance/go/go.sum
      - name: Conformance quarantine lane (non-blocking)
        env:
          CONFORMANCE_LANE: quarantine
        run: go test -tags=integration -timeout 900s ./...

  deploy-gates:
    # The per-service deploy pipeline (Story 1.12). Unit-tests the pure logic (tag parser + poller
    # selection + poller behaviour with stubbed git/docker) and asserts the artifact invariants
    # (release.yml is tag-only / no-SSH; the merged prod stack pulls public GHCR images, binds the
    # board loopback-only, has no `version:`, and fails fast without real creds). All client-side —
    # NO image build here (that is release.yml, tag-only — AR17 keeps the per-PR pipeline build-free).
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag parser unit tests
        run: sh scripts/test-parse-service-tag.sh
      - name: Poller selection unit tests
        run: sh deploy/test-select-deploys.sh
      - name: Poller behaviour test (stubbed git/docker/flock)
        run: bash deploy/test-poller-deploy.sh
      - name: Release-workflow invariants (tag-only, no SSH, public GHCR push)
        run: sh scripts/check-release-workflow.sh
      - name: Prod-compose validity (GHCR images, loopback board, no version:, creds-fail-fast)
        run: sh scripts/check-prod-compose.sh

  conventional-commits:
    # Conventional Commits gate the squash merge; enforce on PRs (the PR commits / title).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
