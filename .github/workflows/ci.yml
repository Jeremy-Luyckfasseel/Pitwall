# Primary CI pipeline. Path-filtered so a change only runs the jobs it affects; a `contract/**`
# change fans out to all consumers (AR17). Complements corpus-coherence.yml (grep-gate + contract
# example validation) — this file adds the schema-lint and Conventional-Commits gates it does not
# cover. Green on the empty scaffold.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.filter.outputs.contract }}
      services: ${{ steps.filter.outputs.services }}
      libs: ${{ steps.filter.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contract:
              - 'contract/**'
              - 'scripts/check-schema-lint.py'
              - 'scripts/validate-contract.py'
              - 'scripts/check-invalid-fixtures.py'
              - 'tests/contract/**'
              - 'pytest.ini'
            services:
              - 'services/**'
              - 'contract/**'   # a contract change rebuilds every consumer (fan-out)
              - 'libs/**'
            libs:
              - 'libs/**'

  schema-lint:
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema
      - name: Schema-lint — envelope well-formed + no additionalProperties:false on event objects
        run: python scripts/check-schema-lint.py
      - name: Schema-lint selftest (proves the gate catches a violation)
        run: python scripts/check-schema-lint.py --selftest

  invalid-fixtures:
    # The NEGATIVE pass of the contract-test layer: every *.invalid.json known-bad fixture
    # MUST be rejected, and required example<->invalid pairs must exist (a deleted/orphaned
    # or no-longer-bad fixture fails the build). Complements the example-pass that runs in
    # corpus-coherence.yml (validate-contract.py).
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema
      - name: Known-bad fixtures are rejected + pairing enforced
        run: python scripts/check-invalid-fixtures.py
      - name: Invalid-fixtures selftest (proves the gate has teeth)
        run: python scripts/check-invalid-fixtures.py --selftest

  contract-tests:
    # Exhaustive contract-validation suite: programmatically exercises every possible
    # envelope/data violation against the timing schemas (plus the committed
    # examples/fixtures and the gate selftests). Comprehensive sibling of the gate scripts.
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet jsonschema pytest
      - name: pytest — exhaustive contract validation
        run: python -m pytest tests/contract

  timing-go:
    # The Timing Go service skeleton (Story 1.3). Build + vet + unit tests always; the
    # integration test stands up a REAL RabbitMQ via testcontainers (GitHub's ubuntu
    # runners ship Docker, so no extra wiring needed). Triggered by services/** and the
    # contract/** fan-out (a contract change re-tests the producer's validate-on-publish).
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/timing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/timing/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real RabbitMQ via testcontainers)
        run: go test -tags=integration -timeout 300s ./test/integration/...

  leaderboard-go:
    # The Leaderboard Go consumer service (Story 1.7). Build + vet + unit tests always;
    # the integration test stands up a REAL RabbitMQ via testcontainers. No Node step is
    # needed: //go:embed all:dist resolves against the committed dist/.gitkeep placeholder,
    # so the Go gate tests the SSE/render/consume logic independently of the frontend build
    # (the real Vite bundle is built in the Docker image's node stage). Triggered by
    # services/** and the contract/** fan-out (re-tests validate-on-consume).
    needs: changes
    if: ${{ needs.changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/leaderboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: services/leaderboard/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Integration tests (real RabbitMQ via testcontainers)
        run: go test -tags=integration -timeout 300s ./test/integration/...

  conventional-commits:
    # Conventional Commits gate the squash merge; enforce on PRs (the PR commits / title).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
