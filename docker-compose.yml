# Pitwall — local (dev/staging) stack. Compose Specification (NO top-level `version:` field).
# Brings up the shared bus (RabbitMQ). Services are added here as each one is built
# (walking-skeleton-first — grow, don't pre-scaffold). Prod overrides live in
# docker-compose.prod.yml; the VPS is prod-only (ADR-0007).
name: pitwall

services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine   # 4.3.x supported line (AR2); alpine = RAM-friendly (7 GB VPS budget)
    container_name: pitwall-rabbitmq
    hostname: pitwall-rabbitmq              # stable node name → the durable volume keeps its data across restarts
    environment:
      # Mapped from the shared .env (see .env.example). Defaults match .env.example so a bare
      # `docker compose config` works in CI; real values come from the gitignored .env.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pitwall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      # Bound to loopback only — secure by default (the host published port is for local tooling;
      # inter-service traffic uses the compose network name `rabbitmq:5672`, never the host port).
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"   # AMQP
      - "127.0.0.1:15672:15672"                   # Management UI + HTTP API
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq           # durable broker (survives `down` without -v)
    healthcheck:
      # Bus-only liveness — never an app HTTP /health (NFR18). Asserts the node is running and
      # its listeners (AMQP + management) accept connections. No sleeps (AR17).
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # First service on the bus (Story 1.3): the Go skeleton. Publishes a 1 s
  # control.heartbeat to its own timing.events exchange; liveness is bus-only.
  # Story 1.4 adds a private SQLite DB (timing-data volume) + transactional
  # outbox + relay (publishes durably; survives a bus outage and a restart).
  # Story 1.5 adds the env-toggled simulator (SIMULATOR_ENABLED): when on, it
  # streams session.started -> lap.recorded -> session.ended for N fixture
  # drivers through the outbox — the local walking-skeleton demo. ON by default
  # here (dev), so a bare `compose up` shows a live lap stream.
  timing:
    build:
      context: .                            # repo root — the service needs /contract (outside its dir)
      dockerfile: services/timing/Dockerfile
    container_name: pitwall-timing
    depends_on:
      rabbitmq:
        condition: service_healthy          # don't start until the broker is ready (no sleeps, AR17)
      identity:
        condition: service_started          # register-first (Story 2.3): the simulator resolves ids via
                                            # Identity. The resolver retries the lookup until Identity binds,
                                            # so this only avoids a cold-start retry delay (not correctness).
    environment:
      # Inside the compose network services reach the broker by name, never the host port.
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pitwall}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: timing
      LIVENESS_FILE: /tmp/pitwall-timing.live
      CONTRACT_DIR: /contract               # the /contract tree COPYed into the image
      DB_PATH: ${DB_PATH:-/data/timing.db}  # private SQLite DB on the durable volume below
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-200}
      # Simulator (Story 1.5) + lap-validity filter (Story 1.6). ON by default
      # for the local demo; set SIMULATOR_ENABLED=false in .env to run the bare
      # heartbeat-only service. When on, the data-shaping knobs and MIN_LAP_TIME_MS
      # are REQUIRED (the service fails fast if any is unset) — defaults below keep
      # the bare `compose config` valid. MIN_LAP_TIME_MS must be below SIM_LAP_MEAN_MS.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIM_DRIVERS: ${SIM_DRIVERS:-8}
      SIM_LAP_MEAN_MS: ${SIM_LAP_MEAN_MS:-45000}
      SIM_LAP_STDDEV_MS: ${SIM_LAP_STDDEV_MS:-2000}
      SIM_SESSION_LAPS: ${SIM_SESSION_LAPS:-10}
      MIN_LAP_TIME_MS: ${MIN_LAP_TIME_MS:-10000}
      SIM_TICK_MS: ${SIM_TICK_MS:-250}
      SIM_SESSION_GAP_MS: ${SIM_SESSION_GAP_MS:-5000}
      SIM_SEED: ${SIM_SEED:-}
      # Register-first gate check-in (Story 2.3): how many sim drivers check in via a
      # transponder (rest via QR), and Timing's FIRST inbound consumer (identity.resolved)
      # DLQ policy (Story 1.9, Q&A Round 27). Defaults keep the bare `compose config` valid.
      SIM_TRANSPONDERS: ${SIM_TRANSPONDERS:-2}
      # Register-first enforcement + the unknown-token operator exception (Story 2.5,
      # FR39): how many synthetic "stray" (unbound-transponder) crossings the simulator
      # injects per session — held + persisted + flagged, never counted, never minted.
      # Defaults to 1 so a bare `compose up` visibly exercises the exception; the
      # code-level default (unset) stays 0 (no behavior change).
      SIM_UNKNOWN_TOKEN_SCANS: ${SIM_UNKNOWN_TOKEN_SCANS:-1}
      CONSUME_PREFETCH: ${CONSUME_PREFETCH:-16}
      DLQ_MAX_ATTEMPTS: ${DLQ_MAX_ATTEMPTS:-5}
      DLQ_RETRY_BASE_MS: ${DLQ_RETRY_BASE_MS:-1000}
      DLQ_RETRY_MULTIPLIER: ${DLQ_RETRY_MULTIPLIER:-2}
      DLQ_RETRY_MAX_MS: ${DLQ_RETRY_MAX_MS:-60000}
    volumes:
      - timing-data:/data                   # private DB survives `down` (without -v) and restarts
    healthcheck:
      # Bus-only liveness — touch-file freshness, never an HTTP /health (ADR-0004, NFR18).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Second service on the bus, the first CONSUMER (Story 1.7): the Go leaderboard.
  # It consumes Timing's lap.recorded off the timing.events exchange, dedupes via a
  # durable idempotent inbox, validates on consume, folds a best-lap standings
  # projection (private SQLite on leaderboard-data), and serves a live trackside
  # board — a //go:embed-ed Vite/React bundle pushed over SSE (never HTTP polling).
  # It also emits a 1 s control.heartbeat to its OWN leaderboard.events exchange;
  # liveness is bus-only (touch-file healthcheck, never an HTTP /health).
  leaderboard:
    build:
      context: .                            # repo root — the service needs /contract (outside its dir)
      dockerfile: services/leaderboard/Dockerfile
    container_name: pitwall-leaderboard
    depends_on:
      rabbitmq:
        condition: service_healthy          # don't start until the broker is ready (no sleeps, AR17)
      timing:
        condition: service_started          # so a bare `up` shows laps flowing onto the board
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pitwall}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: leaderboard              # per-service (not the shared .env value)
      LIVENESS_FILE: /tmp/pitwall-leaderboard.live
      CONTRACT_DIR: /contract               # the /contract tree COPYed into the image
      DB_PATH: /data/leaderboard.db         # private SQLite DB (inbox + standings) on the durable volume
      HTTP_ADDR: ":8080"                    # in-container listen addr for the SSE endpoint + embedded SPA
      CONSUME_PREFETCH: ${CONSUME_PREFETCH:-16}
      DLQ_MAX_ATTEMPTS: ${DLQ_MAX_ATTEMPTS:-5}            # Story 1.9 DLQ policy (Q&A Round 27)
      DLQ_RETRY_BASE_MS: ${DLQ_RETRY_BASE_MS:-1000}       # exponential backoff: 1s -> 2s -> 4s -> 8s
      DLQ_RETRY_MULTIPLIER: ${DLQ_RETRY_MULTIPLIER:-2}
      DLQ_RETRY_MAX_MS: ${DLQ_RETRY_MAX_MS:-60000}
    ports:
      # Loopback only — the trackside board UI is viewable locally at http://127.0.0.1:<port>.
      # This is the live display (SSE + SPA), NOT a health endpoint (liveness is bus-only).
      - "127.0.0.1:${LEADERBOARD_HTTP_PORT:-8080}:8080"
    volumes:
      - leaderboard-data:/data              # private DB survives `down` (without -v) and restarts
    healthcheck:
      # Bus-only liveness — touch-file freshness, never an HTTP /health (ADR-0004, NFR18).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Canonical-id issuer (Story 2.2): consumes identity.lookup_requested off
  # frontend.events and replies identity.resolved on its own identity.events via the
  # outbox. No published ports — liveness is bus-only (heartbeat + touch-file).
  identity:
    build:
      context: .                            # repo root — the service needs /contract (outside its dir)
      dockerfile: services/identity/Dockerfile
    container_name: pitwall-identity
    depends_on:
      rabbitmq:
        condition: service_healthy          # don't start until the broker is ready (no sleeps, AR17)
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-pitwall}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-1000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: identity                 # per-service (not the shared .env value)
      LIVENESS_FILE: /tmp/pitwall-identity.live
      CONTRACT_DIR: /contract               # the /contract tree COPYed into the image
      DB_PATH: /data/identity.db            # private SQLite DB (identities + inbox + outbox)
      SOURCE_EXCHANGE: ${IDENTITY_SOURCE_EXCHANGE:-frontend.events}  # the originating intent exchange (Q&A Round 30)
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-200}
      CONSUME_PREFETCH: ${CONSUME_PREFETCH:-16}
      DLQ_MAX_ATTEMPTS: ${DLQ_MAX_ATTEMPTS:-5}            # Story 1.9 DLQ policy (Q&A Round 27)
      DLQ_RETRY_BASE_MS: ${DLQ_RETRY_BASE_MS:-1000}       # exponential backoff: 1s -> 2s -> 4s -> 8s
      DLQ_RETRY_MULTIPLIER: ${DLQ_RETRY_MULTIPLIER:-2}
      DLQ_RETRY_MAX_MS: ${DLQ_RETRY_MAX_MS:-60000}
    volumes:
      - identity-data:/data                 # private DB survives `down` (without -v) and restarts
    healthcheck:
      # Bus-only liveness — touch-file freshness, never an HTTP /health (ADR-0004, NFR18).
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  rabbitmq-data:
  timing-data:                              # Timing's private SQLite store (Story 1.4)
  leaderboard-data:                         # Leaderboard's private SQLite store (Story 1.7)
  identity-data:                            # Identity's private SQLite store (Story 2.2)
