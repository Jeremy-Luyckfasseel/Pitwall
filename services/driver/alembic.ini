[alembic]
script_location = migrations
# The real URL is set at runtime by migrations/env.py from the DB_PATH env var (the
# same variable Driver's own config.py reads) — this placeholder is never used.
sqlalchemy.url = sqlite:///./driver.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
