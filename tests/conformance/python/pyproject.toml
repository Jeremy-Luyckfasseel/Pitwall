[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitwall-conformance"
version = "0.1.0"
description = "Python runner for the cross-language conformance harness (Story 3.1, AC4) — reads the SAME tests/conformance/scenarios/*.yaml the Go runner reads."
requires-python = ">=3.14"
dependencies = [
    "pika>=1.3,<2",
    "pyyaml>=6,<7",
    "testcontainers[rabbitmq]>=4,<5",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["pitwall_conformance"]
